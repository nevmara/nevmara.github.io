<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - Nevmara Software</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
        }
        .dark {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-surface: #141218;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
        }
        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-center items-center text-center px-6">
    <div class="max-w-md mx-auto">
        <a href="/" class="inline-block mb-8">
            <img src="logo.svg" alt="Nevmara Logo" class="w-16 h-16 mx-auto rounded-2xl shadow-sm">
        </a>
        <h1 class="font-display text-7xl font-bold mb-4 text-md-primary">404</h1>
        <h2 class="text-2xl font-semibold mb-3">Sayfa Bulunamadı / Page Not Found</h2>
        <p class="text-md-onSurfaceVariant mb-8 leading-relaxed">
            Aradığınız sayfa mevcut değil veya taşınmış olabilir.
            <br>
            <span class="text-sm opacity-80">The page you are looking for doesn't exist or has been moved.</span>
        </p>
        <a href="/" class="inline-flex items-center gap-2 bg-md-primary text-md-onPrimary rounded-full px-8 py-3.5 text-sm font-bold shadow-md hover:opacity-90 transition-opacity">
            Ana Sayfaya Dön / Go to Homepage
        </a>
    </div>
</body>
</html>
